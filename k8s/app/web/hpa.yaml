apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attendee-web-hpa
  namespace: meeting-utility
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attendee-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
