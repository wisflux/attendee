apiVersion: v1
kind: ServiceAccount
metadata:
  name: attendee-bot-launcher
  namespace: meeting-utility
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bot-pod-manager
  namespace: meeting-utility
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attendee-bot-launcher-binding
  namespace: meeting-utility
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bot-pod-manager
subjects:
  - kind: ServiceAccount
    name: attendee-bot-launcher
    namespace: meeting-utility
