apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: attendee
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:wisflux/attendee.git
    targetRevision: prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: meeting-utility
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
