# Only k8s/app is auto-synced. k8s/platform (stateful infra, ingress) and
# k8s/bootstrap (secrets, RBAC, one-shot jobs) are applied deliberately, not
# on every push — see k8s/bootstrap/README.md.
when:
  - event: push
    branch: prod
    path:
      - "k8s/app/**"

steps:
  argocd-sync:
    image: wisfluxp/ci-deploy-tools:stable
    environment:
      ARGOCD_SERVER:
        from_secret: argocd_server
      ARGOCD_TOKEN:
        from_secret: argocd_token
      ARGOCD_APP_NAME:
        from_secret: argocd_app_name
    commands:
      - |
        set -eu
        echo "K8s manifests changed — syncing ArgoCD application: $${ARGOCD_APP_NAME}..."

        SERVER="$${ARGOCD_SERVER#https://}"
        SERVER="$${SERVER#http://}"
        SERVER="$${SERVER%/}"

        HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
          -X POST \
          "https://$${SERVER}/api/v1/applications/$${ARGOCD_APP_NAME}/sync" \
          -H "Authorization: Bearer $${ARGOCD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"prune": false}')

        if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
          echo "ArgoCD sync failed with HTTP $HTTP_STATUS"
          cat /tmp/sync_response.json
          exit 1
        fi

        jq -r '.status // "Sync triggered"' /tmp/sync_response.json
        echo ""
        echo "ArgoCD sync triggered for $${ARGOCD_APP_NAME}"
        echo "Commit: $CI_COMMIT_SHA"
